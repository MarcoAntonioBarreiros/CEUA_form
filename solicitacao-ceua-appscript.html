<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário CEUA 2025 — UFPR Palotina</title>
<style>
body{font-family:Arial,sans-serif;background:#E8F4F6;color:#164549;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px}
.box{background:#fff;border:1px solid #D1E9ED;border-radius:16px;padding:28px;max-width:720px;box-shadow:0 8px 24px rgba(42,123,136,.12)}
.err{display:none;color:#991B1B;background:#FEE2E2;border:1px solid #FCA5A5;padding:12px;border-radius:10px;margin-top:16px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <h1>Carregando formulário CEUA...</h1>
  <p>Carregando a versão institucional com registro obrigatório, validação de pendências e preservação automática do rascunho.</p>
  <div id="erro" class="err"></div>
</div>
<script>
(function(){
  const PAGES='https://marcoantoniobarreiros.github.io/CEUA_form/';
  const VER='20261119-1';
  // Reservas no raw.githubusercontent.com: as cópias ATUAIS da pasta
  // formulario-base na main (as antigas, fixadas em commit, não têm os campos
  // novos e deixariam os módulos sem os campos que validam).
  const RAW_BASE='https://raw.githubusercontent.com/MarcoAntonioBarreiros/CEUA_form/main/formulario-base/solicitacao-ceua-appscript.html';
  const RAW_ORIGINAL_ATUAL='https://raw.githubusercontent.com/MarcoAntonioBarreiros/CEUA_form/main/formulario-base/formulario-original.html';
  // Endereço que aparece escrito na base (é o trecho que o replace procura).
  const RAW_ORIGINAL='https://raw.githubusercontent.com/MarcoAntonioBarreiros/CEUA_form/backup-index-before-appscript-20260623/index.html';
  // A base e o formulario original passam a ser servidos pelo proprio GitHub
  // Pages (mesma origem da pagina). O raw.githubusercontent.com fica so como
  // reserva: era ele que falhava de forma intermitente com HTTP 503.
  const BASE_URLS=[
    'formulario-base/solicitacao-ceua-appscript.html?v='+VER,
    PAGES+'formulario-base/solicitacao-ceua-appscript.html?v='+VER,
    RAW_BASE
  ];
  const ORIGINAL_URL=PAGES+'formulario-base/formulario-original.html?v='+VER;
  const VALIDATION_URL='https://marcoantoniobarreiros.github.io/CEUA_form/ceua-validation-v2.js?v='+VER;
  const INSTALLATION_URL='https://marcoantoniobarreiros.github.io/CEUA_form/ceua-installation-status.js?v='+VER;
  const COMBINED_URL='https://marcoantoniobarreiros.github.io/CEUA_form/ceua-combined-validation.js?v='+VER;
  const PROJECT_REVIEW_URL='https://marcoantoniobarreiros.github.io/CEUA_form/ceua-project-review-link.js?v='+VER;
  // Tenta cada endereco em ordem e repete a lista uma segunda vez antes de
  // desistir, para absorver falhas temporarias de um dos servidores.
  function baixarTexto(urls,rodadas){
    let ultimoErro=null;
    function tentar(i,rodada){
      if(i>=urls.length){
        if(rodada+1<rodadas){
          return new Promise(function(ok){setTimeout(ok,800);}).then(function(){return tentar(0,rodada+1);});
        }
        throw ultimoErro||new Error('Falha ao carregar a base do formulário: nenhuma fonte disponível.');
      }
      return fetch(urls[i],{cache:'no-store'}).then(function(response){
        if(!response.ok) throw new Error('HTTP '+response.status);
        return response.text();
      }).catch(function(err){
        ultimoErro=new Error('Falha ao carregar a base do formulário: '+err.message);
        return tentar(i+1,rodada);
      });
    }
    return Promise.resolve().then(function(){return tentar(0,0);});
  }

  function trocar(texto,de,para,rotulo){
    const novo=texto.replace(de,para);
    if(novo===texto) throw new Error('Não foi possível ajustar a base do formulário ('+rotulo+').');
    return novo;
  }

  baixarTexto(BASE_URLS,2)
    .then(function(loader){
      let modified=loader.replace(
        'Instalação indicada declarada como cadastrada e regular no CIUCA',
        'Instalação declarada como cadastrada no CIUCA'
      );
      modified=modified.replace("const instOk = document.getElementById('inst_ciuca_confirm')?.checked;","const instOk = true;");
      const pdfNeedle="lv('Nome da instalação:',V('inst_ciuca_nome'),42);\\n  cbx(";
      const pdfReplacement="lv('Nome da instalação:',V('inst_ciuca_nome'),42);\\n  lv('Cadastro no CIUCA:',V('inst_ciuca_cadastro'),42);\\n  lv('Situação / enquadramento:',(V('inst_ciuca_lic_status')||V('inst_ciuca_nao_motivo')),42);\\n  if(V('inst_ciuca_protocolo')) lv('Licença/protocolo:',V('inst_ciuca_protocolo'),42);\\n  if(V('inst_ciuca_justificativa')){ sub('Justificativa do enquadramento:'); tb(V('inst_ciuca_justificativa'),3); }\\n  cbx(";
      modified=modified.replace(pdfNeedle,pdfReplacement);
      // Segunda camada: o formulario original tambem vem do GitHub Pages.
      modified=trocar(modified,
        "  const SOURCE_URL = '"+RAW_ORIGINAL+"';",
        `  const SOURCE_URL = '${ORIGINAL_URL}';
  const SOURCE_FALLBACK = '${RAW_ORIGINAL_ATUAL}';`,
        'fonte do formulário original');
      modified=trocar(modified,
        "  fetch(SOURCE_URL, {cache:'no-store'})",
        `  function carregarOriginal(lista){
    return fetch(lista[0], {cache:'no-store'}).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r;
    }).catch(function(err){
      if(lista.length > 1) return carregarOriginal(lista.slice(1));
      throw err;
    });
  }
  carregarOriginal([SOURCE_URL, SOURCE_FALLBACK])`,
        'carregamento do formulário original');
      const replacement="html = html.replace('</body>', '<script src=\""+VALIDATION_URL+"\"><\\/script><script src=\""+INSTALLATION_URL+"\"><\\/script><script src=\""+COMBINED_URL+"\"><\\/script><script src=\""+PROJECT_REVIEW_URL+"\"><\\/script></body>');\n      document.write(html);";
      modified=modified.replace(/document\.write\(html\);/,replacement);
      if(modified===loader) throw new Error('Não foi possível inserir os módulos institucionais na base restaurada.');
      document.open();
      document.write(modified);
      document.close();
    })
    .catch(function(error){
      const box=document.getElementById('erro');
      box.style.display='block';
      box.textContent='Erro ao carregar o formulário: '+error.message+' Recarregue a página (F5); se persistir, avise a CEUA.';
    });
})();
</script>
</body>
</html>
