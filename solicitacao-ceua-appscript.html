<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulário CEUA 2025 — UFPR Palotina</title>
<style>
body{font-family:Arial,sans-serif;background:#E8F4F6;color:#164549;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px}
.box{background:#fff;border:1px solid #D1E9ED;border-radius:16px;padding:28px;max-width:720px;box-shadow:0 8px 24px rgba(42,123,136,.12)}
.err{display:none;color:#991B1B;background:#FEE2E2;border:1px solid #FCA5A5;padding:12px;border-radius:10px;margin-top:16px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box">
  <h1>Carregando formulário CEUA...</h1>
  <p>Carregando a versão institucional com registro obrigatório, validação de pendências e preservação automática do rascunho.</p>
  <div id="erro" class="err"></div>
</div>
<script>
(function(){
  const BASE_URL='https://raw.githubusercontent.com/MarcoAntonioBarreiros/CEUA_form/95cc54e193cb4199b6563ca5be1316900c438f48/solicitacao-ceua-appscript.html';
  const VALIDATION_URL='https://marcoantoniobarreiros.github.io/CEUA_form/ceua-validation-v2.js?v=20260803-1405';
  const INSTALLATION_URL='https://marcoantoniobarreiros.github.io/CEUA_form/ceua-installation-status.js?v=20260803-1458';
  const COMBINED_URL='https://marcoantoniobarreiros.github.io/CEUA_form/ceua-combined-validation.js?v=20260803-1518';
  fetch(BASE_URL,{cache:'no-store'})
    .then(function(response){
      if(!response.ok) throw new Error('Falha ao carregar a base do formulário: HTTP '+response.status);
      return response.text();
    })
    .then(function(loader){
      let modified=loader.replace(
        'Instalação indicada declarada como cadastrada e regular no CIUCA',
        'Instalação declarada como cadastrada no CIUCA'
      );
      const pdfNeedle="lv('Nome da instalação:',V('inst_ciuca_nome'),42);\\n  cbx(";
      const pdfReplacement="lv('Nome da instalação:',V('inst_ciuca_nome'),42);\\n  lv('Cadastro no CIUCA:',V('inst_ciuca_cadastro'),42);\\n  lv('Situação do licenciamento:',V('inst_ciuca_lic_status'),42);\\n  if(V('inst_ciuca_protocolo')) lv('Licença/protocolo:',V('inst_ciuca_protocolo'),42);\\n  if(V('inst_ciuca_justificativa')){ sub('Justificativa do enquadramento:'); tb(V('inst_ciuca_justificativa'),3); }\\n  cbx(";
      modified=modified.replace(pdfNeedle,pdfReplacement);
      const replacement="html = html.replace('</body>', '<script src=\""+VALIDATION_URL+"\"><\\/script><script src=\""+INSTALLATION_URL+"\"><\\/script><script src=\""+COMBINED_URL+"\"><\\/script></body>');\n      document.write(html);";
      modified=modified.replace(/document\.write\(html\);/,replacement);
      if(modified===loader) throw new Error('Não foi possível inserir os módulos institucionais na base restaurada.');
      document.open();
      document.write(modified);
      document.close();
    })
    .catch(function(error){
      const box=document.getElementById('erro');
      box.style.display='block';
      box.textContent='Erro ao carregar o formulário: '+error.message;
    });
})();
</script>
</body>
</html>
